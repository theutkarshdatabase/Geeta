<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geeta yadav</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#efeee9',
          },
          fontFamily: {
            hn: ['"Helvetica Neue ME"', 'Helvetica', 'Arial', 'sans-serif'],
            sans: ['"Helvetica Neue ME"', 'Helvetica', 'Arial', 'sans-serif'],
            serif: ['"Helvetica Neue ME"', 'Helvetica', 'Arial', 'sans-serif'],
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            riseIn: {
              '0%': { opacity: '0', transform: 'translateY(4vh) scale(1.03)' },
              '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
            },
            fadeUp: {
              '0%': { opacity: '0', transform: 'translateY(28px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            lineGrow: {
              '0%': { transform: 'scaleX(0)' },
              '100%': { transform: 'scaleX(1)' },
            },
            marquee: {
              '0%': { transform: 'translateX(0)' },
              '100%': { transform: 'translateX(-50%)' },
            }
          },
          animation: {
            'fade-in': 'fadeIn 1.2s ease-out both',
            'rise-in': 'riseIn 1.4s cubic-bezier(0.22, 1, 0.36, 1) both',
            'fade-up': 'fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) both',
            'line': 'lineGrow 1.1s cubic-bezier(0.76, 0, 0.24, 1) both',
            'marquee': 'marquee 30s linear infinite',
          }
        }
      }
    }
  </script>

  <style>
    @font-face {
      font-family: 'Helvetica Neue ME';
      src: url('https://db.onlinewebfonts.com/c/95cecf452d3208890088a5b4c19c7ecf?family=Helvetica+Neue+ME');
    }

    body {
      margin: 0;
      background-color: #000;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        animation-delay: 0ms !important;
      }
    }
  </style>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'https://esm.sh/react@18.3.1';
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
    import { X } from 'https://esm.sh/lucide-react@0.292.0';

    const App = () => {
      const [isOpen, setIsOpen] = useState(false);

      useEffect(() => {
        document.body.style.overflow = isOpen ? 'hidden' : '';
        return () => {
          document.body.style.overflow = '';
        };
      }, [isOpen]);

      return (
        <div className="relative h-[100dvh] w-full overflow-hidden bg-black font-hn text-cream selection:bg-cream selection:text-black">
          
          {/* Background Image Layer (default z-index) */}
          <img 
            src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260729_022513_486985a2-ac8c-4278-91a8-071dcd9fcaff.png&w=1280&q=85" 
            alt="" 
            className="absolute inset-0 h-full w-full object-cover animate-fade-in" 
          />

          {/* Marquee Name Layer (z-10) */}
          <div 
            className="absolute inset-x-0 top-[16vh] sm:top-[14vh] z-10 overflow-hidden animate-fade-up" 
            style={{ animationDelay: '500ms' }}
          >
            <div className="flex w-max whitespace-nowrap font-hn text-[16vh] sm:text-[26vh] leading-none text-cream animate-marquee">
              <span className="pr-[6vw]">Geeta &mdash; Yadav&nbsp;</span>
              <span className="pr-[6vw]">Geeta &mdash; Yadav&nbsp;</span>
            </div>
          </div>

          {/* Horizontal Cream Rule (z-10) */}
          <div 
            className="absolute inset-x-6 sm:inset-x-10 bottom-[5.5rem] sm:bottom-28 z-10 h-0.5 bg-cream origin-left animate-line" 
            style={{ animationDelay: '1200ms' }} 
          />

          {/* Desktop/Mobile Footer (sm:z-10 / z-30) */}
          <div className="absolute inset-x-0 bottom-0 z-30 sm:z-10 flex items-end justify-between px-6 pb-5 sm:px-10 sm:pb-8 text-xs sm:text-sm leading-relaxed font-hn">
            <div className="flex flex-col animate-fade-up" style={{ animationDelay: '1400ms' }}>
              <span>PW</span>
              <span>NEXTTOPPERS</span>
              <span>MISIIONJEET</span>
            </div>
            <div className="flex flex-col text-right animate-fade-up" style={{ animationDelay: '1550ms' }}>
              <span>SAPNO KI UDAAN</span>
              <span>STUDYPARCHAM KE SATH</span>
            </div>
          </div>

          {/* Front Portrait Cutout Layer (z-20) */}
          <img 
            src="https://stone-expand-60400629.figma.site/_assets/v11/8da570354e86aa0d44ac3e4aa335a72c8e750d68.png" 
            alt="Portrait" 
            className="absolute inset-0 h-full w-full object-cover z-20 pointer-events-none animate-rise-in" 
            style={{ animationDelay: '300ms' }}
          />
                    {/* Lowered Explore Button (z-30) */}
          <div className="absolute inset-x-0 bottom-[25vh] z-30 flex justify-center pointer-events-none">
            <button 
              onClick={() => setIsOpen(true)}
              className="pointer-events-auto px-8 py-3 border border-cream/50 bg-transparent text-cream hover:bg-cream hover:text-black transition-all duration-300 font-hn uppercase tracking-widest text-sm backdrop-blur-sm animate-fade-up"
              style={{ animationDelay: '1300ms' }}
            >
              Explore Portals
            </button>
          </div>
<div className="absolute inset-x-0 bottom-[20vh] z-30 flex justify-center pointer-events-none">
            <button 
              onClick={() => window.location.href = '/appearance'}
              className="pointer-events-auto px-8 py-3 border border-cream/50 bg-transparent text-cream hover:bg-cream hover:text-black transition-all duration-300 font-hn uppercase tracking-widest text-sm backdrop-blur-sm animate-fade-up"
              style={{ animationDelay: '1300ms' }}
            >
              Change Appearance
            </button>
          </div>

          {/* Header Chrome (z-30) */}
          <header className="absolute inset-x-0 top-0 z-30 flex items-start justify-between px-6 pt-6 sm:px-10 sm:pt-8 pointer-events-auto">
            <a href="#" className="font-hn text-lg tracking-wide animate-fade-up" style={{ animationDelay: '800ms' }}>
              StudyParcham
            </a>

            {/* Desktop Right Cluster */}
            <div className="hidden sm:flex items-start gap-16 lg:gap-24">
              <span className="text-sm animate-fade-up" style={{ animationDelay: '900ms' }}>2026</span>

              <nav className="flex flex-col gap-0.5 text-sm">
                {['Platforms'].map((item, i) => (
                  <a 
                    key={item} 
                    href="#" 
                    className="hover:opacity-60 transition-opacity duration-300 animate-fade-up" 
                    style={{ animationDelay: `${1000 + i * 80}ms` }}
                  >
                    {item}
                  </a>
                ))}
              </nav>

              <nav className="flex flex-col gap-0.5 text-sm">
                {['Instagram', 'Telegram', 'YouTube'].map((item, i) => (
                  <a 
                    key={item} 
                    href="/contact" 
                    className="hover:opacity-60 transition-opacity duration-300 animate-fade-up" 
                    style={{ animationDelay: `${1150 + i * 80}ms` }}
                  >
                    {item}
                  </a>
                ))}
              </nav>
            </div>
          </header>

          {/* Hamburger Menu Toggle (z-50) */}
          <button 
            onClick={() => setIsOpen(!isOpen)}
            className="sm:hidden absolute right-6 top-6 z-50 h-10 w-10 flex items-center justify-center animate-fade-up"
            style={{ animationDelay: '900ms' }}
            aria-label="Toggle Menu"
          >
            <div className={`relative w-6 h-4 transition-opacity duration-300 ${isOpen ? 'opacity-0' : 'opacity-100'}`}>
              <span className={`absolute left-0 w-full h-[1.5px] bg-cream transition-all duration-500 ease-[cubic-bezier(0.76,0,0.24,1)] ${isOpen ? 'top-[7px] rotate-45' : 'top-0'}`} />
              <span className={`absolute left-0 top-[7px] w-full h-[1.5px] bg-cream transition-opacity duration-300 ${isOpen ? 'opacity-0' : 'opacity-100'}`} />
              <span className={`absolute left-0 w-full h-[1.5px] bg-cream transition-all duration-500 ease-[cubic-bezier(0.76,0,0.24,1)] ${isOpen ? 'bottom-[7px] -rotate-45' : 'bottom-0'}`} />
            </div>
          </button>

          {/* Mobile Drawer Overlay & Panel (z-40 & z-50) */}
          <div className="sm:hidden">
            {/* Backdrop */}
            <div 
              className={`fixed inset-0 z-40 bg-black/40 backdrop-blur-sm transition-opacity duration-500 ${isOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}
              onClick={() => setIsOpen(false)}
            />

            {/* Panel */}
            <div 
              className={`fixed top-0 right-0 h-full w-[80%] max-w-sm bg-[#141414] z-40 px-8 py-10 transition-transform duration-600 ease-[cubic-bezier(0.76,0,0.24,1)] flex flex-col ${isOpen ? 'translate-x-0' : 'translate-x-full'}`}
            >
              {/* Lucide X Close Button */}
              <button 
                onClick={() => setIsOpen(false)}
                className={`absolute right-6 top-6 z-50 text-cream transition-all duration-500 ${isOpen ? 'rotate-0 opacity-100 delay-300' : 'rotate-90 opacity-0'}`}
                aria-label="Close Menu"
              >
                <X size={26} strokeWidth={1.5} />
              </button>

              <div className="mt-12 flex flex-col gap-6">
                <div 
                  className={`text-xs uppercase tracking-[0.2em] text-cream/50 transition-all duration-500 ${isOpen ? 'opacity-100 translate-y-0 delay-250' : 'opacity-0 translate-y-4'}`}
                >
                  PLATFORMS
                </div>
                <nav className="flex flex-col gap-4">
                  {['PW'].map((item, i) => (
                    <a 
                      key={item} 
                      href="https://pw.studyparcham.in" 
                      className={`text-4xl font-hn text-cream transition-all duration-500 ${isOpen ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-6'}`} 
                      style={{ transitionDelay: isOpen ? `${300 + i * 80}ms` : '0ms' }}
                    >
                      {item}
                    </a>
                  ))}
                </nav>
              </div>
              <div className="mt-12 flex flex-col gap-6">
                <div 
                  className={`text-xs uppercase tracking-[0.2em] text-cream/50 transition-all duration-500 ${isOpen ? 'opacity-100 translate-y-0 delay-250' : 'opacity-0 translate-y-4'}`}
                >
                  
                </div>
                <nav className="flex flex-col gap-4">
                  {['NEXTTOPPERS'].map((item, i) => (
                    <a 
                      key={item} 
                      href="https://studyparcham.in/nt" 
                      className={`text-4xl font-hn text-cream transition-all duration-500 ${isOpen ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-6'}`} 
                      style={{ transitionDelay: isOpen ? `${300 + i * 80}ms` : '0ms' }}
                    >
                      {item}
                    </a>
                  ))}
                </nav>
              </div>
              <div className="mt-12 flex flex-col gap-6">
                <div 
                  className={`text-xs uppercase tracking-[0.2em] text-cream/50 transition-all duration-500 ${isOpen ? 'opacity-100 translate-y-0 delay-250' : 'opacity-0 translate-y-4'}`}
                >
                  
                </div>
                <nav className="flex flex-col gap-4">
                  {['Missionjeet'].map((item, i) => (
                    <a 
                      key={item} 
                      href="https://studyparcham.in/mj" 
                      className={`text-4xl font-hn text-cream transition-all duration-500 ${isOpen ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-6'}`} 
                      style={{ transitionDelay: isOpen ? `${300 + i * 80}ms` : '0ms' }}
                    >
                      {item}
                    </a>
                  ))}
                </nav>
              </div>
              <div className="mt-12 flex flex-col gap-6">
                <div 
                  className={`text-xs uppercase tracking-[0.2em] text-cream/50 transition-all duration-500 ${isOpen ? 'opacity-100 translate-y-0 delay-250' : 'opacity-0 translate-y-4'}`}
                >
                  
                </div>
                <nav className="flex flex-col gap-4">
                  {['TESTBOOK'].map((item, i) => (
                    <a 
                      key={item} 
                      href="https://studyparcham.in/code" 
                      className={`text-4xl font-hn text-cream transition-all duration-500 ${isOpen ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-6'}`} 
                      style={{ transitionDelay: isOpen ? `${300 + i * 80}ms` : '0ms' }}
                    >
                      {item}
                    </a>
                  ))}
                </nav>
              </div>

              <div className="mt-auto flex flex-col gap-4">
                <div 
                  className={`text-xs uppercase tracking-[0.2em] text-cream/50 transition-all duration-500 ${isOpen ? 'opacity-100 translate-y-0 delay-500' : 'opacity-0 translate-y-4'}`} 
                >
                  CONTACTS
                </div>
                <div className="flex flex-wrap gap-4">
                  {['Instagram', 'Telegram', 'YouTube'].map((item, i) => (
                    <a 
                      key={item} 
                      href="/contact" 
                      className={`text-sm font-hn text-cream transition-all duration-500 ${isOpen ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'}`} 
                      style={{ transitionDelay: isOpen ? `${550 + i * 60}ms` : '0ms' }}
                    >
                      {item}
                    </a>
                  ))}
                </div>
              </div>
            </div>
          </div>

        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
